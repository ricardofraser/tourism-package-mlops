
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # =======================================================
  # 1. REGISTER DATASET
  # =======================================================
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt

      - name: Register Dataset
        run: |
          python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv


  # =======================================================
  # 2. DATA PREPARATION
  # =======================================================
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Run Data Preparation
        run: |
          python tourism_project/model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/Xtrain.csv
            tourism_project/data/Xtest.csv
            tourism_project/data/ytrain.csv
            tourism_project/data/ytest.csv


  # =======================================================
  # 3. MODEL TRAINING
  # =======================================================
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt
          pip install mlflow==3.16.1

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data

      # ---------------------------------------------------
      # Start local MLflow tracking server
      # ---------------------------------------------------
      - name: Start MLflow Server
        run: |
          mkdir -p mlflow_artifacts

          nohup mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --artifacts-destination ./mlflow_artifacts \
            --host 0.0.0.0 \
            --port 5000 \
            > mlflow.log 2>&1 &

      # ---------------------------------------------------
      # Confirm MLflow is ready before training begins
      # ---------------------------------------------------
      - name: Wait for MLflow
        run: |
          echo "Waiting for MLflow server..."

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000 > /dev/null; then
              echo "MLflow server is ready."
              exit 0
            fi

            echo "MLflow not ready yet - attempt $i/30"
            sleep 2
          done

          echo "MLflow failed to start."
          cat mlflow.log
          exit 1

      # ---------------------------------------------------
      # Train, tune, evaluate and save both models
      # ---------------------------------------------------
      - name: Model Building
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python tourism_project/model_building/train.py

      # ---------------------------------------------------
      # Preserve MLflow experiment records
      # ---------------------------------------------------
      - name: Upload MLflow Tracking Records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking-records
          path: |
            mlflow.db
            mlflow_artifacts/
            mlflow.log
          if-no-files-found: warn
          retention-days: 30

      # ---------------------------------------------------
      # Commit latest deployment artifacts
      # ---------------------------------------------------
      - name: Commit Trained Deployment Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/pre_engagement_model.joblib
          git add tourism_project/deployment/post_engagement_model.joblib
          git add tourism_project/deployment/model_config.json

          git commit -m "Update trained tourism models [skip ci]" \
            || echo "No model changes to commit"

          git push
